<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001820"/>
      <stop offset="100%" stop-color="#000508"/>
    </radialGradient>
    <radialGradient id="sonar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006688" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003344" stop-opacity="0"/>
    </radialGradient>
    <filter id="biolum">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ping">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <ellipse cx="160" cy="80" rx="130" ry="75" fill="url(#sonar)"/>
  <!-- sonar ping rings -->
  <g fill="none" stroke="#008aaa" filter="url(#ping)">
    <circle cx="160" cy="80" r="12"  stroke-width="1.5" opacity="0.75"/>
    <circle cx="160" cy="80" r="28"  stroke-width="1.2" opacity="0.58"/>
    <circle cx="160" cy="80" r="46"  stroke-width="1"   opacity="0.42"/>
    <circle cx="160" cy="80" r="66"  stroke-width="0.8" opacity="0.28"/>
    <circle cx="160" cy="80" r="90"  stroke-width="0.6" opacity="0.16"/>
    <circle cx="160" cy="80" r="118" stroke-width="0.5" opacity="0.09"/>
  </g>
  <!-- sonar sweep line -->
  <line x1="160" y1="80" x2="225" y2="28" stroke="#00aacc" stroke-width="1" opacity="0.2"/>
  <!-- bioluminescent creatures / particles -->
  <g fill="#00e5cc" filter="url(#biolum)">
    <circle cx="42"  cy="35"  r="1.5" opacity="0.7"/>
    <circle cx="88"  cy="22"  r="1"   opacity="0.6"/>
    <circle cx="195" cy="18"  r="1.8" opacity="0.75"/>
    <circle cx="258" cy="42"  r="1.2" opacity="0.65"/>
    <circle cx="290" cy="28"  r="1"   opacity="0.55"/>
    <circle cx="30"  cy="95"  r="1.5" opacity="0.5"/>
    <circle cx="78"  cy="118" r="1"   opacity="0.6"/>
    <circle cx="240" cy="112" r="1.5" opacity="0.65"/>
    <circle cx="295" cy="100" r="1.2" opacity="0.55"/>
    <circle cx="18"  cy="140" r="1"   opacity="0.5"/>
    <circle cx="62"  cy="148" r="1.8" opacity="0.6"/>
    <circle cx="270" cy="145" r="1.2" opacity="0.55"/>
    <circle cx="308" cy="135" r="1"   opacity="0.5"/>
  </g>
  <!-- deep creature silhouette (subtle) -->
  <ellipse cx="160" cy="80" rx="4" ry="3" fill="#00aacc" opacity="0.8" filter="url(#biolum)"/>
  <!-- pressure lines (horizontal) -->
  <g stroke="#002530" stroke-linecap="round" fill="none" opacity="0.25">
    <line x1="0" y1="30"  x2="320" y2="30"  stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="320" y2="80"  stroke-width="0.5"/>
    <line x1="0" y1="130" x2="320" y2="130" stroke-width="0.5"/>
  </g>
</svg>
