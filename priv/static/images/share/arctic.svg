<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1e2e"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <filter id="frost">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aurora">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- aurora borealis -->
  <path d="M 0 40 Q 80 20 160 45 Q 240 65 320 35" stroke="#00d4aa" stroke-width="18" fill="none" opacity="0.08" filter="url(#aurora)"/>
  <path d="M 0 55 Q 90 30 180 58 Q 260 78 320 50" stroke="#00aacc" stroke-width="12" fill="none" opacity="0.07" filter="url(#aurora)"/>
  <!-- snowflake crystal at center -->
  <g transform="translate(160,80)" stroke="#b0d8f0" stroke-linecap="round" fill="none" filter="url(#frost)">
    <!-- main axes -->
    <line x1="-40" y1="0"   x2="40"  y2="0"   stroke-width="1.2" opacity="0.8"/>
    <line x1="0"   y1="-40" x2="0"   y2="40"  stroke-width="1.2" opacity="0.8"/>
    <line x1="-28" y1="-28" x2="28"  y2="28"  stroke-width="1"   opacity="0.7"/>
    <line x1="28"  y1="-28" x2="-28" y2="28"  stroke-width="1"   opacity="0.7"/>
    <!-- branch details -->
    <line x1="-20" y1="0"   x2="-26" y2="-8"  stroke-width="0.8" opacity="0.6"/>
    <line x1="-20" y1="0"   x2="-26" y2="8"   stroke-width="0.8" opacity="0.6"/>
    <line x1="20"  y1="0"   x2="26"  y2="-8"  stroke-width="0.8" opacity="0.6"/>
    <line x1="20"  y1="0"   x2="26"  y2="8"   stroke-width="0.8" opacity="0.6"/>
    <line x1="0"   y1="-20" x2="-8"  y2="-26" stroke-width="0.8" opacity="0.6"/>
    <line x1="0"   y1="-20" x2="8"   y2="-26" stroke-width="0.8" opacity="0.6"/>
    <line x1="0"   y1="20"  x2="-8"  y2="26"  stroke-width="0.8" opacity="0.6"/>
    <line x1="0"   y1="20"  x2="8"   y2="26"  stroke-width="0.8" opacity="0.6"/>
    <!-- inner hexagon -->
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" stroke-width="0.8" opacity="0.5"/>
    <!-- center -->
    <circle cx="0" cy="0" r="3" fill="#b0d8f0" opacity="0.9"/>
  </g>
  <!-- smaller crystals -->
  <g transform="translate(48,38)" stroke="#80b0d0" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#frost)">
    <line x1="-14" y1="0"  x2="14"  y2="0"  stroke-width="0.8"/>
    <line x1="0"   y1="-14" x2="0"  y2="14" stroke-width="0.8"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke-width="0.6"/>
    <line x1="10"  y1="-10" x2="-10" y2="10" stroke-width="0.6"/>
  </g>
  <g transform="translate(272,118)" stroke="#80b0d0" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#frost)">
    <line x1="-12" y1="0"  x2="12"  y2="0"  stroke-width="0.8"/>
    <line x1="0"   y1="-12" x2="0"  y2="12" stroke-width="0.8"/>
    <line x1="-8"  y1="-8"  x2="8"  y2="8"  stroke-width="0.6"/>
    <line x1="8"   y1="-8"  x2="-8" y2="8"  stroke-width="0.6"/>
  </g>
  <!-- ice particles -->
  <g fill="#c0e0f8" opacity="0.5">
    <circle cx="30"  cy="22"  r="1"/>
    <circle cx="288" cy="18"  r="0.8"/>
    <circle cx="15"  cy="130" r="1.2"/>
    <circle cx="305" cy="145" r="0.8"/>
    <circle cx="95"  cy="145" r="1"/>
    <circle cx="220" cy="25"  r="1"/>
  </g>
</svg>
