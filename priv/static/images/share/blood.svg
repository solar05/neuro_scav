<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100202"/>
      <stop offset="100%" stop-color="#050000"/>
    </linearGradient>
    <radialGradient id="stain" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#600808" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#200202" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <rect width="320" height="160" fill="url(#stain)"/>
  <!-- blood drips from top -->
  <g fill="#8b0000">
    <!-- drip 1: thick, long -->
    <rect x="68"  y="0" width="4"   height="72"/>
    <ellipse cx="70"  cy="76"  rx="7"  ry="9"/>
    <!-- trailing drop -->
    <ellipse cx="70"  cy="94"  rx="3"  ry="4"  opacity="0.7"/>
    <!-- drip 2 -->
    <rect x="130" y="0" width="3"   height="50"/>
    <ellipse cx="132" cy="54"  rx="6"  ry="8"/>
    <!-- drip 3: very long -->
    <rect x="188" y="0" width="5"   height="100"/>
    <ellipse cx="190" cy="104" rx="8"  ry="11"/>
    <!-- small trailing drops -->
    <ellipse cx="190" cy="122" rx="3.5" ry="4.5" opacity="0.7"/>
    <ellipse cx="190" cy="136" rx="2"   ry="3"   opacity="0.5"/>
    <!-- drip 4 -->
    <rect x="248" y="0" width="2.5" height="38"/>
    <ellipse cx="249" cy="41"  rx="5"  ry="7"/>
    <!-- drip 5: short -->
    <rect x="35"  y="0" width="2"   height="18"/>
    <ellipse cx="36"  cy="20"  rx="3.5" ry="5"  opacity="0.8"/>
    <!-- drip 6 -->
    <rect x="288" y="0" width="3"   height="60"/>
    <ellipse cx="289" cy="63"  rx="6"  ry="8"/>
  </g>
  <!-- blood pool / splatter at bottom -->
  <ellipse cx="70"  cy="153" rx="22" ry="7"  fill="#6b0000" opacity="0.7"/>
  <ellipse cx="190" cy="155" rx="30" ry="8"  fill="#7a0000" opacity="0.75"/>
  <ellipse cx="249" cy="152" rx="18" ry="5"  fill="#600000" opacity="0.6"/>
  <!-- splatter drops -->
  <g fill="#8b0000" opacity="0.5">
    <circle cx="50"  cy="148" r="3"/>
    <circle cx="90"  cy="145" r="2"/>
    <circle cx="108" cy="150" r="1.5"/>
    <circle cx="168" cy="148" r="2.5"/>
    <circle cx="210" cy="146" r="2"/>
    <circle cx="228" cy="151" r="1.5"/>
    <circle cx="270" cy="147" r="2"/>
  </g>
  <!-- wet sheen -->
  <ellipse cx="190" cy="100" rx="10" ry="8" fill="#cc1010" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="70"  cy="74"  rx="8"  ry="6" fill="#cc1010" opacity="0.12" filter="url(#glow)"/>
</svg>
