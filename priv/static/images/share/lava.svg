<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <radialGradient id="bg" cx="40%" cy="65%" r="80%">
      <stop offset="0%" stop-color="#3a0800"/>
      <stop offset="60%" stop-color="#1a0300"/>
      <stop offset="100%" stop-color="#050100"/>
    </radialGradient>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- underground heat glow -->
  <ellipse cx="130" cy="110" rx="90" ry="55" fill="url(#hot)" filter="url(#soft)"/>
  <!-- cracks -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M 130 110 L 75 38"   stroke="#ff7700" stroke-width="2"   opacity="0.85"/>
    <path d="M 130 110 L 42 128"  stroke="#ff5500" stroke-width="1.5" opacity="0.65"/>
    <path d="M 130 110 L 185 22"  stroke="#ff8800" stroke-width="2.5" opacity="0.9"/>
    <path d="M 130 110 L 228 72"  stroke="#ff6600" stroke-width="1.5" opacity="0.75"/>
    <path d="M 130 110 L 295 138" stroke="#ff4400" stroke-width="1"   opacity="0.55"/>
    <path d="M 130 110 L 162 158" stroke="#ff7700" stroke-width="1.5" opacity="0.7"/>
    <path d="M 75 38  L 55 8"     stroke="#ff6600" stroke-width="1"   opacity="0.45"/>
    <path d="M 185 22 L 248 8"    stroke="#ff5500" stroke-width="1"   opacity="0.4"/>
    <path d="M 228 72 L 308 55"   stroke="#ff6600" stroke-width="1"   opacity="0.5"/>
    <path d="M 42 128 L 10 155"   stroke="#ff4400" stroke-width="1"   opacity="0.4"/>
  </g>
  <!-- heat nodes -->
  <circle cx="130" cy="110" r="6"  fill="#ff9900" opacity="0.9" filter="url(#glow)"/>
  <circle cx="75"  cy="38"  r="3"  fill="#ff7700" opacity="0.7" filter="url(#glow)"/>
  <circle cx="185" cy="22"  r="2.5" fill="#ff6600" opacity="0.6" filter="url(#glow)"/>
  <circle cx="228" cy="72"  r="2"  fill="#ff5500" opacity="0.5" filter="url(#glow)"/>
</svg>
