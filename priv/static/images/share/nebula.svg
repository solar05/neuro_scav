<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#130820"/>
      <stop offset="100%" stop-color="#050008"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8020c0" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#4010a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#200060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wing1" cx="30%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0050c0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#001050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wing2" cx="70%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#a020e0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#300080" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- nebula clouds -->
  <ellipse cx="160" cy="80"  rx="140" ry="65" fill="url(#core)"  filter="url(#cloud)"/>
  <ellipse cx="90"  cy="70"  rx="90"  ry="50" fill="url(#wing1)" filter="url(#cloud)"/>
  <ellipse cx="230" cy="90"  rx="85"  ry="45" fill="url(#wing2)" filter="url(#cloud)"/>
  <!-- dust lanes (darker streaks) -->
  <path d="M 50 60 Q 160 50 270 75"  stroke="#050010" stroke-width="12" fill="none" opacity="0.35" filter="url(#cloud)"/>
  <path d="M 80 95 Q 170 105 260 88" stroke="#050010" stroke-width="8"  fill="none" opacity="0.25" filter="url(#cloud)"/>
  <!-- stars -->
  <g filter="url(#star-glow)">
    <circle cx="22"  cy="18"  r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="68"  cy="12"  r="0.8" fill="#d0c0ff" opacity="0.8"/>
    <circle cx="112" cy="28"  r="1"   fill="#ffffff" opacity="0.7"/>
    <circle cx="148" cy="8"   r="1.4" fill="#e0d0ff" opacity="0.9"/>
    <circle cx="200" cy="15"  r="0.8" fill="#ffffff" opacity="0.75"/>
    <circle cx="245" cy="22"  r="1.2" fill="#c0b0ff" opacity="0.8"/>
    <circle cx="285" cy="10"  r="0.9" fill="#ffffff" opacity="0.85"/>
    <circle cx="305" cy="32"  r="1"   fill="#d0c0ff" opacity="0.7"/>
    <circle cx="38"  cy="135" r="1"   fill="#ffffff" opacity="0.7"/>
    <circle cx="82"  cy="148" r="0.8" fill="#e0d0ff" opacity="0.75"/>
    <circle cx="135" cy="142" r="1.2" fill="#ffffff" opacity="0.65"/>
    <circle cx="195" cy="150" r="0.9" fill="#c0b0ff" opacity="0.7"/>
    <circle cx="248" cy="140" r="1"   fill="#ffffff" opacity="0.8"/>
    <circle cx="292" cy="148" r="1.3" fill="#d0c0ff" opacity="0.75"/>
    <!-- bright foreground stars -->
    <circle cx="55"  cy="55"  r="1.8" fill="#ffffff" opacity="0.95"/>
    <circle cx="272" cy="48"  r="1.5" fill="#f0e8ff" opacity="0.9"/>
    <circle cx="160" cy="80"  r="2.2" fill="#ffffff" opacity="1"/>
  </g>
  <!-- star cross-hair at center -->
  <line x1="160" y1="72" x2="160" y2="88" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
  <line x1="152" y1="80" x2="168" y2="80" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
</svg>
