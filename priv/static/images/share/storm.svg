<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060615"/>
      <stop offset="50%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#030310"/>
    </linearGradient>
    <filter id="bolt-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="flash">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- storm clouds -->
  <rect x="0"   y="0"  width="320" height="45" fill="#0e0e28" opacity="0.9"/>
  <ellipse cx="80"  cy="28" rx="75" ry="22" fill="#14142e" opacity="0.7"/>
  <ellipse cx="220" cy="22" rx="90" ry="20" fill="#121230" opacity="0.7"/>
  <ellipse cx="155" cy="38" rx="60" ry="16" fill="#101025" opacity="0.6"/>
  <!-- distant lightning (faint) -->
  <polyline points="255,0 242,52 258,52 248,95"
    stroke="#4050c0" stroke-width="1.2" fill="none" opacity="0.25" filter="url(#bolt-glow)"/>
  <!-- flash illumination -->
  <ellipse cx="175" cy="160" rx="120" ry="60" fill="#6070e0" opacity="0.06" filter="url(#flash)"/>
  <!-- main lightning bolt -->
  <polyline points="175,0 155,58 174,58 142,160"
    stroke="#7080e0" stroke-width="3.5" fill="none" filter="url(#bolt-glow)"/>
  <!-- bright white core -->
  <polyline points="175,0 155,58 174,58 142,160"
    stroke="#e8eeff" stroke-width="1.2" fill="none" opacity="0.95"/>
  <!-- ground impact -->
  <ellipse cx="142" cy="157" rx="28" ry="7" fill="#8090ff" opacity="0.25" filter="url(#bolt-glow)"/>
  <!-- rain streaks -->
  <g stroke="#202040" stroke-width="0.5" opacity="0.35">
    <line x1="20"  y1="60"  x2="14"  y2="90"/>
    <line x1="50"  y1="50"  x2="44"  y2="80"/>
    <line x1="90"  y1="65"  x2="84"  y2="95"/>
    <line x1="230" y1="55"  x2="224" y2="85"/>
    <line x1="265" y1="65"  x2="259" y2="95"/>
    <line x1="295" y1="50"  x2="289" y2="80"/>
    <line x1="35"  y1="100" x2="29"  y2="130"/>
    <line x1="75"  y1="110" x2="69"  y2="140"/>
    <line x1="240" y1="105" x2="234" y2="135"/>
    <line x1="280" y1="100" x2="274" y2="130"/>
  </g>
</svg>
