<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <radialGradient id="bg" cx="45%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#0d2210"/>
      <stop offset="100%" stop-color="#020802"/>
    </radialGradient>
    <filter id="fog">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- fog layers -->
  <rect x="0" y="90" width="320" height="30" fill="#1a3a18" opacity="0.18" filter="url(#fog)"/>
  <rect x="0" y="110" width="320" height="50" fill="#0a1a08" opacity="0.3" filter="url(#fog)"/>
  <!-- ripples from disturbance point -->
  <g fill="none" stroke="#2a7030" stroke-linecap="round">
    <ellipse cx="140" cy="95" rx="18"  ry="8"  stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="140" cy="95" rx="38"  ry="16" stroke-width="1.2" opacity="0.55"/>
    <ellipse cx="140" cy="95" rx="60"  ry="24" stroke-width="1"   opacity="0.4"/>
    <ellipse cx="140" cy="95" rx="85"  ry="33" stroke-width="0.8" opacity="0.28"/>
    <ellipse cx="140" cy="95" rx="112" ry="42" stroke-width="0.6" opacity="0.18"/>
  </g>
  <!-- bubbles -->
  <circle cx="140" cy="95" r="3"  fill="#3a8040" opacity="0.7" filter="url(#glow)"/>
  <circle cx="95"  cy="88" r="2"  fill="#2a6030" opacity="0.5"/>
  <circle cx="175" cy="102" r="1.5" fill="#3a7038" opacity="0.4"/>
  <circle cx="58"  cy="112" r="1.5" fill="#2a5028" opacity="0.45"/>
  <circle cx="212" cy="90"  r="1"  fill="#2a6030" opacity="0.35"/>
  <!-- will-o-wisps -->
  <ellipse cx="60"  cy="55" rx="10" ry="6" fill="#40a050" opacity="0.12" filter="url(#fog)"/>
  <ellipse cx="255" cy="45" rx="8"  ry="5" fill="#30a040" opacity="0.1"  filter="url(#fog)"/>
  <!-- reeds silhouette -->
  <line x1="285" y1="160" x2="278" y2="80" stroke="#101a10" stroke-width="3" opacity="0.8"/>
  <line x1="295" y1="160" x2="290" y2="70" stroke="#0d180d" stroke-width="2.5" opacity="0.7"/>
  <line x1="305" y1="160" x2="300" y2="85" stroke="#0f1a0f" stroke-width="2" opacity="0.6"/>
  <ellipse cx="278" cy="78" rx="5" ry="8" fill="#182018" opacity="0.7"/>
  <ellipse cx="290" cy="68" rx="4" ry="7" fill="#182018" opacity="0.6"/>
</svg>
