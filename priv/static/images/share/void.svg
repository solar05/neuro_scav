<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d2e"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    <radialGradient id="eye-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3040c0" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1020a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000020" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <ellipse cx="160" cy="80" rx="120" ry="60" fill="url(#eye-grad)"/>
  <!-- stars -->
  <g fill="#a0b0ff" filter="url(#glow)">
    <circle cx="18"  cy="14"  r="1"   opacity="0.9"/>
    <circle cx="52"  cy="32"  r="0.8" opacity="0.7"/>
    <circle cx="81"  cy="9"   r="1.1" opacity="0.8"/>
    <circle cx="108" cy="47"  r="0.7" opacity="0.6"/>
    <circle cx="139" cy="18"  r="1"   opacity="0.9"/>
    <circle cx="192" cy="25"  r="0.8" opacity="0.7"/>
    <circle cx="218" cy="41"  r="1.1" opacity="0.8"/>
    <circle cx="251" cy="12"  r="0.7" opacity="0.9"/>
    <circle cx="279" cy="48"  r="1"   opacity="0.7"/>
    <circle cx="304" cy="20"  r="0.9" opacity="0.8"/>
    <circle cx="33"  cy="68"  r="0.8" opacity="0.5"/>
    <circle cx="62"  cy="90"  r="0.7" opacity="0.4"/>
    <circle cx="91"  cy="112" r="1"   opacity="0.6"/>
    <circle cx="117" cy="75"  r="1.2" opacity="0.7"/>
    <circle cx="241" cy="78"  r="1.5" opacity="0.8"/>
    <circle cx="267" cy="98"  r="0.8" opacity="0.6"/>
    <circle cx="292" cy="70"  r="1"   opacity="0.7"/>
    <circle cx="22"  cy="138" r="0.8" opacity="0.5"/>
    <circle cx="58"  cy="148" r="1"   opacity="0.6"/>
    <circle cx="98"  cy="136" r="0.7" opacity="0.5"/>
    <circle cx="145" cy="152" r="1.1" opacity="0.4"/>
    <circle cx="188" cy="134" r="0.8" opacity="0.7"/>
    <circle cx="228" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="270" cy="140" r="0.7" opacity="0.6"/>
    <circle cx="308" cy="148" r="1.1" opacity="0.8"/>
  </g>
  <!-- bright star -->
  <circle cx="160" cy="80" r="2" fill="#6080ff" opacity="0.9" filter="url(#glow)"/>
  <line x1="160" y1="72" x2="160" y2="88" stroke="#8090ff" stroke-width="0.5" opacity="0.6"/>
  <line x1="152" y1="80" x2="168" y2="80" stroke="#8090ff" stroke-width="0.5" opacity="0.6"/>
