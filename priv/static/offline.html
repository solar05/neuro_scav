<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>ScavGen — Offline</title>
  <style>
    @font-face {
      font-family: "Bender";
      font-weight: normal;
      src: url("/fonts/Bender.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Bender", cursive;
      background: #000;
      color: #a5a5a5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #3a3a46;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 2px solid #d49300;
      box-shadow: 0 0 40px rgba(212, 147, 0, 0.12);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 {
      color: #d49300;
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #d49300;
      color: #010101;
      border: none;
      border-radius: 10px;
      padding: 10px 28px;
      font-family: "Bender", cursive;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #ffbb33; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>Looks like you're offline. Check your internet connection and try again.</p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
